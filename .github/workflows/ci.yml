name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.9" }
          - { os: ubuntu-22.04, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.12" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v
      - name: 安装与卸载冒烟（仅类 Unix）
        if: runner.os != 'Windows'
        run: bash tests/smoke.sh

  quality:
    name: lint + 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff build
      - run: ruff check .
      - run: python -m build
      - name: 安装 wheel 并验证命令
        run: |
          pip install dist/*.whl
          tk --version
          tk-doctor --json > /dev/null || true

  bench:
    name: 基准（不阻塞）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bench/bench.py
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench/RESULTS.md
            bench/results.json
