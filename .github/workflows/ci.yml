name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: syntax
        run: |
          python3 -m py_compile scripts/*.py
          bash -n scripts/install.sh
      - name: smoke
        run: bash tests/smoke.sh
